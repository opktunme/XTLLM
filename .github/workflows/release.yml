name: XTLLM release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        shell: pwsh
        run: choco install ninja vulkan-sdk --no-progress -y
      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_COMPILER=clang++.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build
      - name: Validate launcher
        shell: pwsh
        run: |
          python -m py_compile xtllm.py ovllm.py tools/xtllm_chat_server.py tools/ovllm_chat_server.py
          Get-ChildItem tools/convert_*.py | ForEach-Object { python -m py_compile $_.FullName }
          python xtllm.py models
      - name: Package
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          .\scripts\package-release.ps1 -Version $version -SkipBuild
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.zip
            dist/*.sha256

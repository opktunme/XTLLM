name: Bug report
description: Report a reproducible engine, converter, or correctness defect
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not attach licensed model weights or private prompts."
  - type: input
    id: model
    attributes: {label: Exact checkpoint/revision}
    validations: {required: true}
  - type: textarea
    id: hardware
    attributes: {label: Hardware and driver, description: "GPU, VRAM, RAM, OS, Vulkan driver, SSD"}
    validations: {required: true}
  - type: textarea
    id: command
    attributes: {label: Exact command and plan output}
    validations: {required: true}
  - type: textarea
    id: repro
    attributes: {label: Reproduction and observed output}
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: Expected behavior}
    validations: {required: true}

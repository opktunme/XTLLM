name: Feature request
description: Propose a focused model/backend/runtime improvement
title: "[feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes: {label: Problem and measured bottleneck}
    validations: {required: true}
  - type: textarea
    id: proposal
    attributes: {label: Proposed change}
    validations: {required: true}
  - type: textarea
    id: evidence
    attributes: {label: Expected end-to-end impact and quality/safety risks}
